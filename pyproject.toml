[project]
name = "agent-hub"
version = "0.5.0"
description = "Agent Hub MCP - task-driven multi-agent coordination with cross-session continuity"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.0,<4.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
hubctl = "agent_hub.cli:main"
hubrunner = "agent_hub.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
