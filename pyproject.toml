[project]
name = "agent-hub-mcp"
version = "0.6.0"
description = "Agent Hub MCP - task-driven multi-agent coordination with cross-session continuity"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ma Zheng", email = "mazhengeod@users.noreply.github.com" },
]
keywords = ["mcp", "multi-agent", "task-coordination", "agent-hub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=3.4.0,<4.0.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/mazhengeod/agent-hub"
Repository = "https://github.com/mazhengeod/agent-hub"
Issues = "https://github.com/mazhengeod/agent-hub/issues"

[project.scripts]
hubctl = "agent_hub.cli:main"
hubrunner = "agent_hub.runner:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "agent_hub/migrations"

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/INTEGRATION.md",
    "/LICENSE",
    "/README.md",
    "/README.zh-CN.md",
    "/config.example.yaml",
    "/docs",
    "/migrations",
    "/pyproject.toml",
    "/src",
    "/systemd",
    "/tests",
    "/uv.lock",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "build>=1.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "build>=1.2,<2",
]
